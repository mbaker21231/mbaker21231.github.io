<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Economics – Matthew J. Baker</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183049;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}header{background:#153b5d;color:white;padding:18px max(24px,calc((100% - 1120px)/2))}header a{color:white;text-decoration:none;font-weight:650}header nav{display:flex;gap:24px;align-items:center;flex-wrap:wrap}header nav a:first-child{font-size:1.2rem}main{max-width:1120px;margin:30px auto;padding:0 24px 48px}h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:0 0 8px}p{line-height:1.55}.lead{color:#4a6277;margin:0 0 24px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button,.switch button{font:inherit;border:1px solid #b7c9d7;background:white;color:#183b59;padding:10px 16px;border-radius:8px;cursor:pointer}.tabs button[aria-selected=true],.switch button[aria-pressed=true]{background:#176b99;border-color:#176b99;color:white}.layout{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid #d6e2eb;border-radius:12px;padding:22px;box-shadow:0 3px 14px #12345609}.control label{font-weight:650;display:block;margin-bottom:12px}.control output{font-size:1.8rem;font-weight:750;color:#176b99;display:block;margin-bottom:8px}input[type=range]{width:100%;accent-color:#176b99;cursor:pointer}.scale{display:flex;justify-content:space-between;color:#5e7484;font-size:.9rem}.switch{display:flex;gap:8px;margin-bottom:24px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 16px}.metric{background:#edf5fa;padding:12px;border-radius:8px}.metric small{display:block;color:#49667b;line-height:1.3;min-height:2.6em}.metric strong{font-size:1.25rem}.chart{width:100%;height:auto;display:block}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:#49667b;margin-top:8px}.legend span:before{content:'';display:inline-block;width:14px;height:4px;background:var(--c);vertical-align:middle;margin-right:6px}.welfare{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.welfare div{border-top:4px solid var(--c);padding-top:7px}.welfare small{display:block;color:#526a7a}.welfare strong{font-size:1.1rem}.note{font-size:.95rem;color:#536a7b;margin:20px 0 0}@media(max-width:760px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}header{padding:16px 24px}}@media(max-width:430px){.welfare{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><nav><a href="./index.html">Matthew J. Baker</a><a href="./teaching.html">Teaching</a><a href="./research.html">Research</a></nav></header>
<main><h1>Interactive supply and demand</h1><p class="lead">Move a slider to see how market outcomes and economic surplus change.</p>
<div class="tabs" role="tablist" aria-label="Economics exercise"><button type="button" role="tab" aria-selected="true" data-mode="market">Market price</button><button type="button" role="tab" aria-selected="false" data-mode="control">Price controls</button><button type="button" role="tab" aria-selected="false" data-mode="tax">Per-unit tax</button><button type="button" role="tab" aria-selected="false" data-mode="subsidy">Per-unit subsidy</button></div>
<div class="layout"><section class="panel control"><div id="switch" class="switch" hidden><button type="button" aria-pressed="true" data-control="ceiling">Ceiling</button><button type="button" aria-pressed="false" data-control="floor">Floor</button></div><label for="value" id="slider-label">Market price</label><output id="value-output" for="value"></output><input type="range" id="value" min="0" max="40" step="1" value="20"><div class="scale"><span id="low"></span><span id="high"></span></div><p id="explanation" class="note"></p></section>
<section class="panel"><div id="metrics" class="metrics" aria-live="polite"></div><svg class="chart" id="chart" viewBox="0 0 660 420" role="img" aria-label="Supply and demand graph"></svg><div class="legend"><span style="--c:#176b99">Demand</span><span style="--c:#da7c26">Supply</span><span style="--c:#6843a2">Policy price</span></div><div id="welfare" class="welfare"></div></section></div></main>
<script>
const state={mode:'market',control:'ceiling',market:20,ceiling:15,floor:25,tax:10,subsidy:10};
const settings={market:{label:'Market price',min:0,max:40},ceiling:{label:'Ceiling price',min:0,max:20},floor:{label:'Floor price',min:20,max:40},tax:{label:'Per-unit tax',min:0,max:40},subsidy:{label:'Per-unit subsidy',min:0,max:30}};
const slider=document.querySelector('#value'),out=document.querySelector('#value-output');const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);const money=n=>'$'+fmt(n);const metric=(label,value)=>`<div class="metric"><small>${label}</small><strong>${value}</strong></div>`;const benefit=(label,value,color)=>`<div style="--c:${color}"><small>${label}</small><strong>${fmt(value)}</strong></div>`;
function line(x1,y1,x2,y2,color,width=3,dash=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${dash?'stroke-dasharray="'+dash+'"':''}/>`}
function render(){const key=state.mode==='control'?state.control:state.mode,cfg=settings[key],v=state[key];document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===state.mode));document.querySelector('#switch').hidden=state.mode!=='control';document.querySelectorAll('[data-control]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.control===state.control));slider.min=cfg.min;slider.max=cfg.max;slider.value=v;document.querySelector('#slider-label').textContent=cfg.label;out.textContent=money(v);document.querySelector('#low').textContent=money(cfg.min);document.querySelector('#high').textContent=money(cfg.max);
let qd,qs,q,pc,pp,cs,ps,gov,dwl,metrics,description;
if(key==='market'){qd=100-2*v;qs=20+2*v;q=Math.min(qd,qs);pc=pp=v;description=qd>qs?`Shortage of ${fmt(qd-qs)} units`:qs>qd?`Surplus of ${fmt(qs-qd)} units`:'Market equilibrium';metrics=[['Price',money(v)],['Quantity demanded',fmt(qd)],['Quantity supplied',fmt(qs)],['Market condition',description]];}
else if(key==='ceiling'||key==='floor'){qd=100-2*v;qs=3*v;q=Math.min(qd,qs);pc=pp=v;cs=50*q-q*q/4-v*q;ps=v*q-q*q/6;gov=0;dwl=1500-(50*q-5*q*q/12);description=`${qd>qs?'Shortage':'Surplus'} of ${fmt(Math.abs(qd-qs))} units; ${fmt(q)} units traded.`;metrics=[['Control price',money(v)],['Quantity demanded',fmt(qd)],['Quantity supplied',fmt(qs)],['Quantity traded',fmt(q)]];}
else if(key==='tax'){pc=20+.6*v;pp=20-.4*v;q=60-1.2*v;cs=.5*(50-pc)*q;ps=.5*pp*q;gov=v*q;dwl=1500-(cs+ps+gov);metrics=[['Tax',money(v)],['Consumer price',money(pc)],['Producer price',money(pp)],['Quantity traded',fmt(q)]];description=`Consumers pay ${money(pc)}; producers receive ${money(pp)}.`;}
else {pc=20-.6*v;pp=20+.4*v;q=60+1.2*v;cs=.5*(50-pc)*q;ps=.5*pp*q;gov=-v*q;dwl=1500-(cs+ps+gov);metrics=[['Subsidy',money(v)],['Consumer price',money(pc)],['Producer price',money(pp)],['Quantity traded',fmt(q)]];description=`Consumers pay ${money(pc)}; producers receive ${money(pp)}.`;}
document.querySelector('#metrics').innerHTML=metrics.map(([a,b])=>metric(a,b)).join('');document.querySelector('#explanation').textContent=description;
const welfare=document.querySelector('#welfare');welfare.innerHTML=key==='market'?'':benefit('Consumer surplus',cs,'#176b99')+benefit('Producer surplus',ps,'#da7c26')+(key==='tax'?benefit('Tax revenue',gov,'#6843a2'):key==='subsidy'?benefit('Government expenditure',-gov,'#6843a2'):'')+benefit('Total welfare',cs+ps+gov,'#28775a')+benefit('Deadweight loss',Math.max(0,dwl),'#aa4350');
const x=q=>65+q*5.3,y=p=>360-p*6.4;let svg=`<rect x="0" y="0" width="660" height="420" fill="white"/>`;
for(let p=0;p<=50;p+=10){svg+=line(65,y(p),595,y(p),'#e8eef2',1)+`<text x="50" y="${y(p)+5}" text-anchor="end" fill="#627989" font-size="14">${p}</text>`}for(let z=0;z<=100;z+=20){svg+=line(x(z),40,x(z),360,'#e8eef2',1)+`<text x="${x(z)}" y="385" text-anchor="middle" fill="#627989" font-size="14">${z}</text>`}
svg+=line(65,40,65,360,'#6d8191',2)+line(65,360,595,360,'#6d8191',2)+`<text x="12" y="26" fill="#415c70" font-size="15">Price</text><text x="510" y="413" fill="#415c70" font-size="15">Quantity</text>`;
svg+=line(x(0),y(50),x(100),y(0),'#176b99')+line(x(0),y(0),x(100),y(key==='market'?40:100/3),'#da7c26');
if(key==='market'||key==='ceiling'||key==='floor'){svg+=line(x(0),y(v),x(100),y(v),'#6843a2',2,'7 5')+line(x(q),y(v),x(q),360,'#6843a2',2,'5 5');svg+=`<circle cx="${x(q)}" cy="${y(v)}" r="5" fill="#6843a2"/>`}
else {svg+=line(x(0),y(pc),x(q),y(pc),'#6843a2',2,'7 5')+line(x(0),y(pp),x(q),y(pp),'#6843a2',2,'7 5')+line(x(q),y(pc),x(q),y(pp),'#6843a2',3)+line(x(q),y(pp),x(q),360,'#6843a2',2,'5 5')+`<circle cx="${x(q)}" cy="${y(pc)}" r="5" fill="#176b99"/><circle cx="${x(q)}" cy="${y(pp)}" r="5" fill="#da7c26"/>`}
svg+=`<circle cx="${x(60)}" cy="${y(20)}" r="4" fill="#273a49"/><text x="${x(60)+8}" y="${y(20)-8}" fill="#273a49" font-size="14">Equilibrium</text>`;document.querySelector('#chart').innerHTML=svg;
}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;render()}));document.querySelectorAll('[data-control]').forEach(b=>b.addEventListener('click',()=>{state.control=b.dataset.control;render()}));slider.addEventListener('input',()=>{state[state.mode==='control'?state.control:state.mode]=Number(slider.value);render()});render();
</script></body></html>
